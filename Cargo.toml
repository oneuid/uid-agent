[package]
name = "uid-agent"
version = "2.2.1"
edition = "2021"
description = "UID Agent — Cross-platform endpoint security agent (Linux / macOS / Windows)"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
futures-util = "0.3"
hex = "0.4"

# Windows-only: registry access + Win32 API surface for posture checks
[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"

[build-dependencies]
winres = "0.1.12"
