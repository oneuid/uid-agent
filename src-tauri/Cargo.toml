[package]
name = "uid-agent-desktop"
version = "3.0.4"
description = "UID Agent Desktop Application"
authors = ["UID Team"]
license = "MIT"
repository = "https://github.com/oneuid/uid-agent"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "uid_agent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["tray-icon"] }
tauri-plugin-log = "2"
uid-agent = { path = ".." }
tokio = { version = "1.35", features = ["full"] }
